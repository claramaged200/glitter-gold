<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel – Glitter & Gold</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #fff8f0;
    }
    h1 {
      color: #a67c52;
    }
    form {
      margin-bottom: 20px;
    }
    input, button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 300px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: #f5f5f5;
      padding: 10px;
      margin: 10px 0;
    }
    img {
      max-width: 100px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>🛠 Admin Panel – Glitter & Gold</h1>

  <form id="productForm">
    <input type="text" id="productName" placeholder="Product Name" required />
    <input type="text" id="productPrice" placeholder="Price (EGP)" required />
    <input type="file" id="productImage" accept="image/*" required />
    <button type="submit">Add Product</button>
  </form>

  <ul id="productList"></ul>

  <!-- Firebase SDK -->
  <script type="module" src="./admin.js"></script>

</body>
</html>
