<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glitter & Gold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌟 Glitter & Gold Shop</h1>
    <button id="cartBtn">🛒 <span id="cartCount">0</span></button>
  </header>

  <main>
    <div id="product-list" class="product-grid"></div>
  </main>

  <div id="cartPopup" class="cart-popup hidden">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <p>Total: <span id="totalPrice">0</span> EGP</p>
    <button onclick="checkout('cash')">Pay with Cash</button>
    <button onclick="checkout('visa')">Pay with Visa</button>
    <button onclick="closeCart()">Close</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
